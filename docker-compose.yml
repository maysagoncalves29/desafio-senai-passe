services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: passe
      POSTGRES_PASSWORD: passe
      POSTGRES_DB: passe
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U passe -d passe']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://passe:passe@db:5432/passe?schema=public
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  db-data:
